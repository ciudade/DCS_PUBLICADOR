name: Update AutoUpdater XML on Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build autoupdater.xml
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          cat > autoupdater.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <item>
            <version>${VER}</version>
            <url>https://github.com/ciudade/DCS_PUBLICADOR/releases/latest/download/SGC.zip</url>
            <changelog>https://raw.githubusercontent.com/ciudade/DCS_PUBLICADOR/main/changelog.txt</changelog>
            <mandatory value="false" />
          </item>
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add autoupdater.xml
          git commit -m "Auto-update XML for ${{ github.event.release.tag_name }}" || exit 0
          git push origin main
